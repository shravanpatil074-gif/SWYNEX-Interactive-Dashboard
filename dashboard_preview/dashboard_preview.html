<!doctype html><html><head><meta charset="utf-8"><title>SWYNEX Titanic Dashboard Preview</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{font-family:Arial;margin:24px;background:#f5f7fb;color:#172033}h1{margin-bottom:4px}.sub{color:#667085}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.kpi{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0001}.value{font-size:28px;font-weight:700}.label{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart{background:white;border-radius:12px;padding:8px;box-shadow:0 2px 8px #0001}@media(max-width:900px){.kpis,.grid{grid-template-columns:1fr}}</style></head><body><h1>Titanic Survival Analysis Dashboard</h1><div class="sub">SWYNEX Technologies - Task 3 | Power BI-ready dashboard preview</div><div class="kpis"><div class="kpi"><div class="label">Total Passengers</div><div class="value">891</div></div><div class="kpi"><div class="label">Survivors</div><div class="value">342</div></div><div class="kpi"><div class="label">Overall Survival Rate (%)</div><div class="value">38.38</div></div><div class="kpi"><div class="label">Average Age</div><div class="value">29.37</div></div><div class="kpi"><div class="label">Average Fare</div><div class="value">32.28</div></div></div><div class="grid"><div id="g"></div><div id="c"></div><div id="a"></div><div id="e"></div></div><script>
